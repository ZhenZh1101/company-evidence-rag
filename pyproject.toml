[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-evidence-rag"
version = "0.1.0"
description = "Local, source-grounded RAG for company disclosures and IR archives"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "beautifulsoup4>=4.12,<5", "pypdf>=5,<7", "python-docx>=1.1,<2", "python-pptx>=1,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3", "fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "markdown-it-py>=4,<5"]

[project.scripts]
company-rag = "rag.cli:main"

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[tool.setuptools.package-data]
rag = ["static/*.html"]

[tool.setuptools.packages.find]
include = ["rag*"]
